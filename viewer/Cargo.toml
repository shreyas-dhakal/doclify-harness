[package]
name = "doclify-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
doclify-domain = { path = "../crates/doclify-domain" }
axum = "0.8"
tokio = { version = "1", features = ["net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
rust-embed = "8"
mime_guess = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace]
