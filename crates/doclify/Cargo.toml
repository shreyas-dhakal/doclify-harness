[package]
name = "doclify"
version = "0.1.0"
edition = "2021"

[dependencies]
doclify-domain = { path = "../doclify-domain" }
doclify-capture = { path = "../doclify-capture" }
doclify-model-bridge = { path = "../../model-bridge" }
serde_json = "1"
url = "2"
doclify-evidence = { path = "../doclify-evidence" }
doclify-context = { path = "../doclify-context" }
doclify-pipeline = { path = "../doclify-pipeline" }
doclify-viewer = { path = "../../viewer" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
