[package]
name = "doclify-context"
version = "0.1.0"
edition = "2021"
description = "Bounded startup/resume context and handoffs from reviewed Doclify records"

[dependencies]
doclify-domain = { path = "../doclify-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
